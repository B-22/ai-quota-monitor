; =============================================
; AI Usage 插件配置
; 位置: TrafficMonitor 配置目录下 AIUsage.ini
; 修改后重启 TrafficMonitor 生效
; =============================================

[AIUsage]

; 圆环内是否显示百分比号
; 0 = 只显示数字(默认), 如 55
; 1 = 显示百分比号, 如 55%
ShowPctSign=0

; 是否显示 Credits 超额用量金额
; 0 = 隐藏, 1 = 显示(默认)
ShowCredits=1

; 可选：将 Claude 5h / 7d / Fable 配额和重置时间导出为脱敏文本
; 必须填写完整文件路径；留空关闭。仓库模板不写入个人绝对路径。
ClaudeUsageExportPath=

; 导出刷新间隔，允许 1-1440 分钟；首次获取和状态变化会立即写入
ClaudeUsageExportMinutes=10

; 是否显示 5 小时窗口重置时间
; 0 = 隐藏, 1 = 显示(默认)
ShowReset=1

; 是否显示 Codex 5 小时窗口圆环（含 tooltip 里的 Codex 5h 行）
; auto = 跟随 API(默认)：接口返回 5 小时窗口就显示，成功取到但没有该窗口才隐藏
; 0 = 强制隐藏, 1 = 强制显示
ShowCodex5h=auto

; 是否显示 API 返回的订阅状态和红/绿点
; 0 = 隐藏(默认), 1 = 显示
ShowSubscription=0

; 是否显示 Claude/Codex 独立的数据新鲜度标记
; 超过1分钟在圆环数字下显示黄色短线，超过5分钟变红
; 超过10分钟时，Claude/Codex 的星期值改为紧凑过期分钟数
; 0 = 隐藏, 1 = 显示(默认)
ShowStatus=1

; 是否显示 Claude 7天窗口重置星期
; 标签为 Claude，值显示为: 一、二、...日
; 0 = 隐藏, 1 = 显示(默认)
ShowClaude7dReset=1

; 是否显示 Codex 7天窗口重置星期
; 标签为 Codex，值显示为: 一、二、...日
; 0 = 隐藏, 1 = 显示(默认)
ShowCodex7dReset=1

; 7天重置时间/倒计时
; 自动选择 Claude 和 Codex 中较早的有效重置时间
; 进入阈值后，将 Claude/Codex 原星期值分别替换为倒计时，例如 "5h30m"
; 0 = 隐藏, 1 = 显示(默认)
Show7dCountdown=1

; 距离重置多少小时后才显示倒计时
CountdownShowBeforeHours=24

; Show an urgent reset-credit expiry warning in the Codex weekday column.
; The compact value is rendered as "2卡18h" with a taskbar-contrast gradient.
ShowResetCreditWarning=1

; Warn when the earliest available reset credit expires within this many hours.
ResetCreditWarningHours=48

; Monitor public global-reset announcement windows.
; When a fresh official window is open, a gradient lightning marker appears
; immediately to the left of the three usage rings.
; These anonymous public requests keep any configured proxy route, but bypass
; RequireProxy and AllowedExitIPs because they never send account credentials.
ShowResetRadar=1

; Public radar refresh interval. Allowed range: 5-120 minutes.
ResetRadarRefreshMinutes=15

; Codex Runway reset-today feed refresh interval. Allowed range: 5-240
; minutes. The upstream feed normally updates once per hour.
RunwayResetRefreshMinutes=5

; 是否显示 Antigravity（Google Cloud Code）剩余配额
; 0 = 隐藏, 1 = 显示(默认)
; 需要先运行 ag-login.exe 完成一次 Google 授权才会生效
ShowAntigravity=1

; 是否显示 Kiro IDE Credits 剩余额度
; 0 = 隐藏(默认), 1 = 显示
; 需要本机 Kiro 已登录（读取 .aws/sso/cache/kiro-auth-token.json）
ShowKiro=0

; 是否显示 OpenRouter 圆环（今日免费模型请求数 / 每日额度）
; 需要在下方 [OpenRouter] 段填 ApiKey
; 0 = 隐藏(默认), 1 = 显示
ShowOpenRouter=0

; OpenRouter 余额小方块
; auto = 只在余额低于 LowBalanceUsd 时才显示(默认)
; 0 = 从不显示, 1 = 始终显示
; 是否额外显示 "OR今日 2/1000" 信息块（圆环之外再占一格）
; 注意：任务栏项有宽度预算，这一块约占 58px。开之前先关掉别的东西。
; 0 = 只显示圆环(默认，次数看 tooltip), 1 = 额外显示信息块
ShowOpenRouterToday=0

; tooltip 最大字符数。
; TrafficMonitor 收到超过约 810 字符的 tooltip 时，会在第一次刷新后
; 弹一次"遇到不适当的参数。"。超出部分按整行截断并标注"… (已截断)"。
; 实测：736 / 809 正常，855 触发。启用的 provider 越多越接近上限。
TooltipMaxChars=780

ShowOpenRouterBalance=auto

; 是否独立显示手动设置的 Claude 到期日期
; 任务栏使用紧凑格式，如 8.13
ShowCustomExpiry=0

; Claude 订阅到期日期（锚点），配置使用 YYYY-MM-DD
CustomSubExpiry=

; 到期日期的自动续期周期：monthly（按月）、yearly（按年）、留空=不自动推算
; 设置后，插件每次读取配置都会把上面的锚点日期自动往后推到"下一个未过期的日期"，
; 只需要填一次真实的续费日期，之后不用再手动改
CustomSubExpiryCycle=

; =============================================
; 代理设置
; =============================================

; 代理服务器地址(可选)
; 留空 = 使用系统代理设置
; 示例: http://127.0.0.1:PORT
ProxyServer=

; 是否强制要求代理
; 0 = 不按代理检测结果阻止请求(默认)
; 1 = 无显式/系统代理时阻止；若配置 AllowedExitIPs，则允许经校验的 TUN/VPN
RequireProxy=1

; 公网出口 IP 白名单（推荐 TUN/VPN 用户启用）
; 多个精确 IPv4/IPv6 使用逗号或分号分隔
; 一旦非空，每个 Claude/Codex HTTP 会话建立前都会校验；
; 检测失败或当前出口不在白名单时，请求会 fail-closed，不发送令牌或用量请求
; 示例: AllowedExitIPs=203.0.113.10,2001:db8::10
AllowedExitIPs=

; 返回调用方公网 IP 的纯文本 HTTPS 地址
; 安全校验禁止 HTTP 和重定向；通常无需修改
ExitIpCheckUrl=https://api.ipify.org/

; 1 = 在每次真实请求前，改用该请求目标域名的 /cdn-cgi/trace 检测出口
; 可确保检测与 API 请求命中同一个域名分流规则（推荐）
; 目标域名不支持 /cdn-cgi/trace 时（如 Antigravity 的 Google、Kiro 的 AWS
; 会返回 404），采用宽松策略：默认放行，不再回退到 ExitIpCheckUrl 探测
; （避免不同域名分流规则不一致导致误拦）
; 0 = 始终使用上面的 ExitIpCheckUrl 探测并校验
VerifyTargetHostExitIp=1

; =============================================
; Antigravity（Google Cloud Code）配额
; =============================================
; 通过 Google OAuth 获取模型剩余配额，凭据仅保存在本机该配置文件中。
; ClientId 已内置默认值，留空即自动使用。
; ClientSecret 不内置在代码/仓库（避免 GitHub 密钥扫描拦截推送）：
;   - 填写本段 ClientSecret，或设置环境变量 AIUSAGE_AG_CLIENT_SECRET
;   - 值为 Google 公开的 installed-app 客户端密钥（参考项目明文内置）
; AccessToken / RefreshToken 一键授权（推荐）：
;   1. 双击 TrafficMonitor 目录下的 ag-login.exe（部署脚本会自动放置）
;   2. 浏览器自动打开 Google 登录页，完成授权后令牌自动写回本段
;   之后插件会利用 RefreshToken 自动续期 AccessToken，无需再手动更换。
; 若只提供 AccessToken：到期后无法自动续期，需要重新运行 ag-login.exe
[Antigravity]
ClientId=
ClientSecret=
AccessToken=
RefreshToken=

; 指定哪类模型作为任务栏圆环的"主模型"（子串匹配模型名），留空自动选择：
; 优先 Gemini 3.x，其次 Claude，再其次 GPT；同优先级取剩余最少的一个
PrimaryModel=

; =============================================
; Kiro IDE Credits
; =============================================
; 默认读取 %USERPROFILE%\.aws\sso\cache\kiro-auth-token.json
; 若 Kiro 把令牌放在其他位置，可用 TokenPath 覆盖
[Kiro]
TokenPath=

; =============================================
; Cowork / Code 运行状态指示灯
; =============================================
; 在任务栏显示两个独立的指示灯，分别对应 Claude 桌面端的 Cowork 和 Code。
; 需要在 TrafficMonitor「选项 - 显示设置」里把 "Claude Cowork Status" 和
; "Claude Code Status" 勾选出来，它们是两个独立的显示项。
;
; 颜色含义（多个会话时按紧急度取最高的一个显示）：
;   红 = 有会话在等你授权或提问   黄 = 有会话正在干活
;   绿 = 都干完了，等你发指令     灰 = 没有活动会话
; 灯旁边的数字表示处于该状态的会话数，只有一个会话时不显示数字。
;
; 数据来源：
;   Cowork -> %APPDATA%\Claude\local-agent-mode-sessions 下的 audit.jsonl
;             （Cowork 每个会话有独立配置目录，全局 hooks 对它不生效）
;   Code   -> 本目录 agent-status\code\<会话 id>.json，由 Claude Code 的
;             hooks 在每次状态变化时写入，只有状态和时间两个字段
; Code 灯需要先装 hooks（桌面端 Code 标签页和命令行共用同一份 settings.json，
; 装一次两边都生效）：
;   powershell -File tools\install-code-status-hook.ps1 -ConfigDir "<本目录>"
; 不装 hook 时 Code 灯退化成读转录文件，仍能区分黄/绿/灰，但不会变红：
; 权限弹窗根本不会写进转录文件。
[AgentStatus]
; 显示 Cowork 指示灯
ShowCoworkLight=1

; 显示 Code 指示灯
ShowCodeLight=1

; 会话超过多少分钟没有活动就不再计入（同时决定 Code 灯何时自动隐藏）
AgentIdleTimeoutMinutes=30

; 「工作中」判定的宽限时间（分钟）。Cowork 的一轮对话结束时会在 audit.jsonl
; 写入一条 result 记录；只要最后一条不是 result，就说明这一轮还没跑完，灯显示
; 黄色。但如果 Claude 桌面端在半路被关掉，这条 result 永远不会写入，此时超过
; 本项设定的时间没有新日志就不再算「工作中」。
; Code 灯用同一个时间：hooks 只在状态变化时写一次，如果一轮被中断（按了
; Esc、或 hook 超时）导致结束信号没写出来，超过这个时间后就不再相信那条
; 「工作中」记录，改回按转录文件判断。
; 调大可容忍更久的单个工具调用（实测最长约 8 分钟），调小则中断后灯更快恢复。
CoworkBusyGraceMinutes=10

; Code 灯在没有活动会话时自动隐藏，不占任务栏空间；一开 Code 立刻出现。
; Cowork 灯不受此项影响，始终常驻（无会话时显示灰灯）。
HideCodeLightWhenIdle=1

; 在圆点旁边显示 "Cowork" / "Code" 文字标签，设为 0 则只留一个圆点
ShowAgentLightLabel=1

; 会话数超过 1 个时在灯旁显示数字
ShowAgentLightCount=1

; 两盏灯画在用量仪表盘这一项内部（推荐，默认开）。
; 原因：TrafficMonitor 默认把显示项排成两行，这种模式下仪表盘拿到完整约 32px
; 高度、圆环是满尺寸；而单独的显示项只分到一行（约 20px）。放进仪表盘既能保住
; 圆环大小，又能让灯和其他模块在同一条基线上。
; 设为 0 则改用两个独立显示项（需在显示设置里各自勾选），此时灯会被排到第二行。
LightsInsideDashboard=1

; 给灯组加一个浅灰圆角胶囊底（芯片样式），使其像其他模块一样有"容器"，
; 而不是像跟在 Codex 后面的散落标点。设为 0 则只显示圆点和文字。
LightChip=1

; =============================================
; OpenRouter
; =============================================
; ApiKey：普通 key（sk-or-v1-...），用于读余额和判定免费额度档位。
;   档位看的是累计充值额（total_credits），不是当前余额：
;   累计充值 >= $10 → 免费模型 1000 次/天，否则 50 次/天，一次解锁永久有效。
; ManagementKey：后台 Settings → Management Keys 单独生成的 key。
;   只有它能调 /api/v1/analytics/query，也就是唯一能拿到"今日已用次数"的途径。
;   不填也能跑，只是今日次数显示为 ?/1000。
;   （/api/v1/key 的 usage_daily 是美元消费额，免费模型永远是 0，没法用来数次数）
; FreeDailyLimit：0 = 按 total_credits 自动判定(默认)；也可强制填 50 或 1000。
; LowBalanceUsd：余额低于这个值时余额方块变红并在 tooltip 里告警。
; 注：免费额度按 UTC 零点重置，对应本地每天早上 8 点。
[OpenRouter]
ApiKey=
ManagementKey=
FreeDailyLimit=0
LowBalanceUsd=2.0
